name: Validare rezultate bilete
on:
  schedule:
    - cron: '*/30 * * * *'   # la fiecare 30 de minute (GitHub poate întârzia rulările)
  workflow_dispatch:
    inputs:
      test:
        description: 'Test: judeca biletele 05-07.11 si scrie settle-test.json'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: rezultate
jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node scripts/rezultate.mjs ${{ inputs.test && '--test' || '' }} 2>&1 | tee ultima-validare.txt
          node scripts/rezultate.mjs --legs 2>&1 | tee -a ultima-validare.txt
      - name: Commit
        run: |
          git add settle.json legs.json 2>/dev/null || git add settle.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -m "Validare automata $(TZ=Europe/Bucharest date +'%F %H:%M')"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
