name: Generator bilete
on:
  schedule:
    - cron: '20 5,8,11,14,17,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: generator
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/generator.test.mjs
      - run: node scripts/generator-date.mjs 2>&1 | tee generator-rulare.txt
      - name: Commit
        run: |
          mkdir -p generator && mv generator-rulare.txt generator/ultima-rulare.txt
          git add generator
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -m "Generator $(TZ=Europe/Bucharest date +'%F %H:%M')"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
