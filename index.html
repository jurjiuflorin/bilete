<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biletele mele</title>
<meta name="theme-color" content="#0f2a20">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f2a20'/><path d='M7 9h18v14l-3-2-3 2-3-2-3 2-3-2-3 2z' fill='%23f6f3ea'/><rect x='10' y='12' width='12' height='2' fill='%23f2c230'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#0f2a20; --pitch-2:#143528; --line:rgba(255,255,255,.08);
  --chalk:#e9efe9; --chalk-dim:#9fb3a8;
  --paper:#f6f3ea; --ink:#1d1f1c; --ink-dim:#6d6f68; --rule:#c9c4b5;
  --flood:#f2c230; --won:#21894f; --lost:#c63d33;
  --display:"Barlow Condensed",system-ui,sans-serif;
  --ui:"Barlow",system-ui,sans-serif;
  --slip:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--chalk);font:16px/1.5 var(--ui);
  background:
    radial-gradient(1200px 500px at 50% -200px, #1d4a37 0%, transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 120px, rgba(255,255,255,.018) 120px 240px),
    var(--pitch);}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 64px}

/* header / scoreboard */
.head{display:grid;grid-template-columns:1fr auto;gap:20px 32px;align-items:end;margin-bottom:28px}
h1{font:800 clamp(44px,9vw,84px)/.86 var(--display);margin:0;letter-spacing:-.01em;text-transform:none}
.next{margin-top:12px;color:var(--chalk-dim);font-size:15px;max-width:52ch}
.next strong{color:var(--chalk);font-weight:600}
.next .cd{color:var(--flood);font-weight:600;font-variant-numeric:tabular-nums}
.board{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.25);overflow:hidden}
.board div{padding:10px 18px;text-align:center}
.board div+div{border-left:1px solid var(--line)}
.board b{display:block;font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.board span{font-size:13px;color:var(--chalk-dim)}
.board .w b{color:#5fd393}.board .l b{color:#ff7a6e}
.board .p b{color:var(--flood)}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:22px;position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--pitch) 70%,transparent)}
.tabs{display:flex;background:rgba(0,0,0,.3);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:999px;cursor:pointer;font:600 18px/1 var(--display);letter-spacing:.01em;color:var(--chalk-dim)}
.tabs button[aria-selected=true]{background:var(--chalk);color:var(--pitch)}
.tabs .n{font-weight:500;opacity:.7;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--chalk-dim)}
.chips button[aria-pressed=true]{border-color:var(--flood);color:var(--flood)}
.search{margin-left:auto;flex:0 1 220px;min-width:150px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;color:var(--chalk);padding:8px 14px;font:inherit;font-size:14px}
.search::placeholder{color:var(--chalk-dim)}

/* day groups */
.day{margin:6px 0 30px}
.day h2{font:700 26px/1 var(--display);margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.day h2 small{font:500 15px var(--ui);color:var(--chalk-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;align-items:start}

/* the slip */
.slip{position:relative;background:var(--paper);color:var(--ink);font-family:var(--slip);font-size:13px;
  padding:18px 18px 26px;border-radius:4px 4px 0 0;box-shadow:0 14px 30px -18px rgba(0,0,0,.7);
  --zz:8px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--zz)) no-repeat,
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(2*var(--zz)) var(--zz) repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--zz)) no-repeat,
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(2*var(--zz)) var(--zz) repeat-x;}
.slip-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slip-tip{font:700 22px/1 var(--display);letter-spacing:.01em}
.slip-date{color:var(--ink-dim);font-size:12px;white-space:nowrap}
.code{margin:14px 0 12px;display:flex;align-items:center;gap:10px;border:1.5px dashed var(--rule);border-radius:6px;padding:8px 8px 8px 12px}
.code .lbl{font-size:11px;color:var(--ink-dim);line-height:1.2}
.code .pin{font-size:21px;font-weight:700;letter-spacing:.06em;line-height:1.1}
.code button{margin-left:auto;border:0;background:var(--ink);color:var(--paper);border-radius:5px;padding:8px 12px;font:600 13px var(--ui);cursor:pointer;white-space:nowrap}
.code button.ok{background:var(--won)}
.code.none{color:var(--ink-dim);font-size:12px;justify-content:center}
.legs{list-style:none;margin:0;padding:0}
.legs li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:7px 0;border-top:1px dotted var(--rule)}
.legs .t{color:var(--ink-dim);font-size:12px;padding-top:1px;font-variant-numeric:tabular-nums}
.legs .m{font-family:var(--ui);font-weight:600;font-size:14px;line-height:1.25}
.legs .s{grid-column:2;color:#3b3d38;font-size:12px}
.legs .o{grid-row:1/3;grid-column:3;font-weight:600;font-size:14px;align-self:center}
.legs li.past{opacity:.45}
.more{display:block;width:100%;border:0;border-top:1px dotted var(--rule);background:none;padding:8px 0 0;font:500 13px var(--ui);color:var(--ink-dim);cursor:pointer;text-align:left}
.tot{margin-top:10px;padding-top:10px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.tot .c{font:800 32px/1 var(--display)}
.tot .c small{font:500 12px var(--slip);color:var(--ink-dim);margin-right:6px}
.tot .p{text-align:right;font-size:12px;color:var(--ink-dim);line-height:1.3}
.tot .p b{display:block;color:var(--ink);font-size:15px}
.rez{margin-top:10px;font-size:12px;color:#3b3d38;line-height:1.45}
.tot{position:relative}
.stamp{position:absolute;top:2px;right:0;transform:rotate(-12deg);font:800 24px/1 var(--display);letter-spacing:.06em;
  padding:5px 10px;border:3px solid currentColor;border-radius:6px;opacity:.82;pointer-events:none;mix-blend-mode:multiply}
.stamp.won{color:var(--won)}.stamp.lost{color:var(--lost)}
.slip.settled .code{opacity:.55}
.slip.settled .code button{display:none}
.slip.settled .tot .p{visibility:hidden}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:thump .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d,0s)}
  @keyframes thump{from{transform:rotate(-12deg) scale(1.8);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.82}}
}

.empty{border:1.5px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--chalk-dim)}
.err{background:rgba(198,61,51,.15);border:1px solid rgba(198,61,51,.5);border-radius:10px;padding:16px;color:#ffd5d0}
footer{margin-top:40px;color:var(--chalk-dim);font-size:13px;max-width:70ch;line-height:1.55}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--flood);color:#1d1f1c;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .head{grid-template-columns:1fr}
  .board{justify-self:stretch}.board div{flex:1;padding:8px 6px}.board b{font-size:34px}
  .search{margin-left:0;flex:1 1 100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}
  .chips button{flex:0 0 auto}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1>Biletele mele</h1>
      <p class="next" id="next">Se încarcă biletele…</p>
    </div>
    <div class="board" aria-label="Scor bilete">
      <div class="p"><b id="s-p">–</b><span>de jucat</span></div>
      <div class="w"><b id="s-w">–</b><span>câștigate</span></div>
      <div class="l"><b id="s-l">–</b><span>pierdute</span></div>
    </div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-p" aria-selected="true">De jucat<span class="n" id="n-p"></span></button>
      <button role="tab" id="t-h" aria-selected="false">Istoric<span class="n" id="n-h"></span></button>
    </div>
    <div class="chips" id="chips" aria-label="Tip bilet"></div>
    <input class="search" id="q" type="search" placeholder="Caută o echipă" aria-label="Caută o echipă">
  </div>

  <main id="list"></main>

  <footer>Cotele și șansele sunt estimări din statistici și se pot schimba până plasezi biletul. Codul se folosește în agenția Superbet. Pariază doar sume pe care îți permiți să le pierzi.</footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const MS=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
const ZI=['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];
let rows=[],tab='p',tip='',q='',now=new Date();

function parseLegs(r){
  const [Y,M,D]=r.data.split('-').map(Number);
  return (r.selectii||'').split(' · ').filter(Boolean).map(p=>{
    const m=p.match(/^(?:(\d{2})\.(\d{2}) )?(\d{2}):(\d{2}) (.+?): (.+?)(?: \(([^)]*)\))?$/);
    if(!m) return {meci:p,sel:'',o:'',when:null};
    const d=m[1]?+m[1]:D, mo=m[2]?+m[2]:M;
    const when=new Date(Y,mo-1,d,+m[3],+m[4]);
    return {when,meci:m[5].replace(/ – /,' – '),sel:m[6],o:m[7]||''};
  });
}
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function dayLabel(key){
  const [y,m,d]=key.split('-').map(Number); const dt=new Date(y,m-1,d);
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((dt-t)/864e5);
  const name=diff===0?'Azi':diff===1?'Mâine':diff===-1?'Ieri':ZI[dt.getDay()][0].toUpperCase()+ZI[dt.getDay()].slice(1);
  return [name, d+' '+MS[m-1]];
}
const fmtHM=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const fmtDM=d=>d.getDate()+' '+MS[d.getMonth()];
function pct(s){ if(s==null) return '–'; const v=s*100; return (v>=10?v.toFixed(0):v>=1?v.toFixed(1):v.toFixed(2))+'%'; }
function odds(s){ if(!s||s<0.0005) return ''; return 'cam 1 din '+Math.round(1/s).toLocaleString('ro-RO'); }

function slip(r,i){
  const L=parseLegs(r), settled=r.status!=='în așteptare';
  const s=el('article','slip'+(settled?' settled':''));
  const top=el('div','slip-top');
  const first=L.find(l=>l.when), last=[...L].reverse().find(l=>l.when);
  let span='';
  if(first){ span=fmtDM(first.when); if(last && dayKey(last.when)!==dayKey(first.when)) span+=' – '+fmtDM(last.when); }
  top.append(el('div','slip-tip',r.tip), el('div','slip-date',(L.length+' meciuri')+(span?', '+span:'')));
  s.append(top);

  const c=el('div','code'+(r.cod?'':' none'));
  if(r.cod){
    const box=el('div'); box.append(el('div','lbl','Cod agenție'), el('div','pin',r.cod));
    const b=el('button',null,'Copiază codul'); b.type='button';
    b.onclick=()=>copy(r.cod,b);
    c.append(box,b);
  } else c.textContent='Codul apare la următoarea pregătire';
  s.append(c);

  const ul=el('ul','legs'); const LIM=7; const long=L.length>LIM+1;
  L.forEach((l,k)=>{
    const li=el('li'+'' , (l.when&&l.when<now&&!settled)?'past':'');
    const multi=span.includes('–');
    li.append(el('span','t',l.when?(multi?String(l.when.getDate()).padStart(2,'0')+'.'+String(l.when.getMonth()+1).padStart(2,'0')+' ':'')+fmtHM(l.when):''),
              el('span','m',l.meci), el('span','o',l.o), el('span','s',l.sel));
    if(long&&k>=LIM) li.hidden=true;
    ul.append(li);
  });
  s.append(ul);
  if(long){ const m=el('button','more','Arată toate cele '+L.length+' meciuri'); m.type='button';
    m.onclick=()=>{const open=m.dataset.open!=='1'; ul.querySelectorAll('li').forEach((li,k)=>{if(k>=LIM) li.hidden=!open;}); m.dataset.open=open?'1':'0'; m.textContent=open?'Arată mai puțin':'Arată toate cele '+L.length+' meciuri';};
    s.append(m); }

  const tot=el('div','tot');
  const cc=el('div','c'); cc.append(el('small',null,'cotă'), document.createTextNode(Number(r.cota).toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2})));
  const pp=el('div','p'); pp.append(el('b',null,pct(r.sansa)), document.createTextNode(odds(r.sansa)||'șansă estimată'));
  tot.append(cc,pp); s.append(tot);
  if(r.rezultat) s.append(el('div','rez',r.rezultat));
  if(settled){ const st=el('div','stamp '+(r.status==='câștigat'?'won':'lost'), r.status==='câștigat'?'Câștigat':'Pierdut'); st.style.setProperty('--d',(Math.min(i,8)*.06)+'s'); tot.append(st); }
  return s;
}

function copy(t,b){
  const done=()=>{ toast('Cod copiat: '+t); if(b){b.textContent='Copiat';b.classList.add('ok');setTimeout(()=>{b.textContent='Copiază codul';b.classList.remove('ok');},1600);} };
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(done,()=>toast(t)); else toast(t);
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800);}

function firstWhen(r){ const l=parseLegs(r).find(x=>x.when); return l?l.when:new Date(r.data); }

function render(){
  const list=$('list'); list.replaceChildren();
  let R=rows.filter(r=>(tab==='p')===(r.status==='în așteptare'))
            .filter(r=>!tip||r.tip===tip)
            .filter(r=>!q||(r.selectii||'').toLowerCase().includes(q));
  if(!R.length){ list.append(el('div','empty', tab==='p'?'Niciun bilet de jucat acum. Biletele noi apar dimineața.':'Încă nu s-a încheiat niciun bilet.')); return; }
  // group by day of first match (pending) or ticket date (history)
  const groups=new Map();
  R.sort((a,b)=> tab==='p' ? firstWhen(a)-firstWhen(b) : (b.data+b.id).localeCompare(a.data+a.id));
  for(const r of R){ const k=tab==='p'?(firstWhen(r)<now?'live':dayKey(firstWhen(r))):r.data; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); }
  let i=0;
  for(const [k,arr] of groups){
    const sec=el('section','day'); const [a,b]=k==='live'?['În desfășurare','au început deja unele meciuri']:dayLabel(k);
    const h=el('h2',null,a); h.append(el('small',null,k==='live'?b:b+(tab==='p'?', primul meci':'')));
    const g=el('div','grid'); arr.forEach(r=>g.append(slip(r,i++)));
    sec.append(h,g); list.append(sec);
  }
}

function header(){
  const P=rows.filter(r=>r.status==='în așteptare'), W=rows.filter(r=>r.status==='câștigat').length, Lo=rows.filter(r=>r.status==='pierdut').length;
  $('s-p').textContent=P.length; $('s-w').textContent=W; $('s-l').textContent=Lo;
  $('n-p').textContent=P.length; $('n-h').textContent=W+Lo;
  let best=null;
  for(const r of P) for(const l of parseLegs(r)) if(l.when&&l.when>now&&(!best||l.when<best.when)) best=l;
  const n=$('next'); n.replaceChildren();
  if(best){
    const mins=Math.round((best.when-now)/6e4), h=Math.floor(mins/60), m=mins%60;
    const cd=el('span','cd', mins<60?'în '+mins+' min':h<24?'în '+h+' h '+m+' min':(dayLabel(dayKey(best.when))[0].toLowerCase()+' la '+fmtHM(best.when)));
    n.append('Următorul meci de pe bilete: ', el('strong',null,best.meci), ', ', cd, '.');
  } else n.textContent='Niciun meci programat pe biletele active.';
}

function chips(){
  const box=$('chips'); box.replaceChildren();
  const tips=['',...new Set(rows.map(r=>r.tip))];
  for(const t of tips){ const b=el('button',null,t||'Toate'); b.type='button'; b.setAttribute('aria-pressed',String(t===tip));
    b.onclick=()=>{tip=t;chips();render();}; box.append(b); }
}

$('t-p').onclick=()=>{tab='p';$('t-p').setAttribute('aria-selected','true');$('t-h').setAttribute('aria-selected','false');render();};
$('t-h').onclick=()=>{tab='h';$('t-h').setAttribute('aria-selected','true');$('t-p').setAttribute('aria-selected','false');render();};
$('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});

fetch('bilete.json?v='+Date.now(),{cache:'no-store'})
  .then(r=>{if(!r.ok) throw new Error('fișierul de bilete nu răspunde ('+r.status+')'); return r.json();})
  .then(d=>{ rows=(Array.isArray(d)?d:(d.rows||[])).filter(r=>r.tip!=='Test'); chips(); header(); render();
    setInterval(()=>{now=new Date();header();},60000); })
  .catch(e=>{ $('next').textContent=''; const x=el('div','err','Biletele nu s-au putut încărca: '+e.message+'. Reîncarcă pagina peste un minut.'); $('list').append(x); });
</script>
</body>
</html>
